# Apply once: kubectl apply -f bootstrap/root.yaml. Everything else is driven from apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: root, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/BharatKatyal/nvidia_hackathon_k8.git
    targetRevision: HEAD
    path: apps
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy: {automated: {prune: true, selfHeal: true}}
